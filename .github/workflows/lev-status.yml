name: Check free Lev Space
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'huggingface_hub==1.7.2' 'gradio_client==2.0.0' requests
      - name: Read build state and test fictional text only
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, requests
          from huggingface_hub import HfApi
          token=os.environ['HF_TOKEN'];api=HfApi(token=token);repo='phineas8/tomorrow-lev'
          if api.whoami()['name']!='phineas8':raise RuntimeError('Wrong account')
          info=api.space_info(repo)
          runtime=api.get_space_runtime(repo)
          print('Space URL: https://huggingface.co/spaces/'+repo)
          print('Host:',info.host)
          print('Stage:',runtime.stage,'Hardware:',runtime.hardware)
          if str(runtime.hardware)!='zero-a10g':raise RuntimeError('Free hardware not confirmed')
          if str(runtime.stage)!='RUNNING':
              r=requests.get('https://huggingface.co/api/spaces/'+repo+'/logs/build',headers={'Authorization':'Bearer '+token},timeout=20)
              print('Build log status:',r.status_code)
              print(r.text[-12000:].replace(token,'[redacted]'))
              raise RuntimeError('Space not ready; no score test made')
          from gradio_client import Client
          client=Client(repo,hf_token=token,verbose=False)
          payload={'state':'Fictional label: SampleOnly BD','questions':{'f0':{'type':'noul','instructions':'Does this text explicitly state BD?'}}}
          result=client.predict(payload,api_name='/score')
          print('Fictional test result:',json.dumps(result))
          PY
