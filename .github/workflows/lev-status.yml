name: Check free Lev Space
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'huggingface_hub==1.7.2' 'gradio_client==2.0.0' requests
      - name: Read build state and test fictional text only
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, requests
          from huggingface_hub import HfApi
          token=os.environ['HF_TOKEN'];api=HfApi(token=token);repo='phineas8/tomorrow-lev'
          if api.whoami()['name']!='phineas8':raise RuntimeError('Wrong account')
          info=api.space_info(repo)
          runtime=api.get_space_runtime(repo)
          print('Space URL: https://huggingface.co/spaces/'+repo)
          print('Host:',info.host)
          print('Stage:',runtime.stage,'Hardware:',runtime.hardware)
          print('Requested hardware:',runtime.requested_hardware)
          print('Runtime detail:',runtime.raw)
          if str(runtime.stage)!='RUNNING':
              for kind in ['build','run']:
                  r=requests.get('https://huggingface.co/api/spaces/'+repo+'/logs/'+kind,headers={'Authorization':'Bearer '+token},timeout=20)
                  print(kind+' log status:',r.status_code)
                  print(r.text[-12000:].replace(token,'[redacted]'))
              raise RuntimeError('Space not ready; no score test made')
          if str(runtime.hardware)!='zero-a10g':raise RuntimeError('Free hardware not confirmed')
          import time
          payload={'state':'Fictional label: SampleOnly BD','questions':{'f0':{'type':'noul','instructions':'Does this text explicitly state BD?'}},'model':'english'}
          host='https://phineas8-tomorrow-lev.hf.space';headers={'X-HF-Authorization':'Bearer '+token,'Content-Type':'application/json'}
          deadline=time.monotonic()+35
          submitted=requests.post(host+'/gradio_api/call/score',headers=headers,json={'data':[payload]},timeout=max(0.1,deadline-time.monotonic()));submitted.raise_for_status()
          event=submitted.json()['event_id']
          collected=requests.get(host+'/gradio_api/call/score/'+event,headers=headers,timeout=max(0.1,deadline-time.monotonic()));collected.raise_for_status()
          completed=[block for block in collected.text.split('\n\n') if 'event: complete' in block]
          if not completed:raise RuntimeError('No complete event. No retry.')
          line=next(line for line in completed[0].splitlines() if line.startswith('data: '))
          result=json.loads(line[6:])[0]
          assert isinstance(result['answers']['f0']['noul'],(float,int)) and 0<=result['answers']['f0']['noul']<=1
          assert result['usage']['input_tokens']>=0
          print('Direct HTTP fictional test result:',json.dumps(result))
          print('HTTP event contract passed within 35 seconds; one POST, same-event GET, no retry.')
          PY
