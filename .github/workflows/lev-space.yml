name: Set up free ZeroGPU Lev Space
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'huggingface_hub==1.7.2'
      - name: Create private free ZeroGPU Gradio Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi, SpaceHardware
          api = HfApi(token=os.environ['HF_TOKEN'])
          owner = api.whoami()['name']
          if owner != 'phineas8':
              raise RuntimeError('Token belongs to a different account. No Space created.')
          repo = owner + '/tomorrow-lev'
          api.create_repo(repo, repo_type='space', space_sdk='gradio', space_hardware=SpaceHardware.ZERO_A10G, private=True, exist_ok=True)
          runtime = api.get_space_runtime(repo)
          if runtime.hardware and str(runtime.hardware) != 'zero-a10g':
              raise RuntimeError('Space is not on free ZeroGPU. No upload made.')
          api.upload_folder(repo_id=repo, repo_type='space', folder_path='hf-zerogpu', commit_message='Run encoder-only Lev for Tomorrow on free ZeroGPU')
          print('Space: https://huggingface.co/spaces/' + repo)
          PY
